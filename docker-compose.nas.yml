# 个人网站 —— Docker Compose（绿联 NAS 用）
#
# 更新策略（用 NAS 上独立的 watchtower 项目，本文件不含 watchtower）：
#   · watchtower 挂了 /var/run/docker.sock、开着 WATCHTOWER_LABEL_ENABLE=true，
#     它看到的是整个 NAS 的所有容器（跨 compose 项目），会更新所有带
#     com.centurylinklabs.watchtower.enable=true 标签的容器。
#   · 本文件只给 buding-site 打标签，就能被那个 watchtower 自动更新。
#   · 想立刻更新：Docker 客户端「项目 → buding-site → 更新」，或用后台的「立即更新」按钮。
#
# 网络：额外接入中立的 wt-net 网络，这样容器内能用 http://watchtower:8080
#       调 watchtower 的 HTTP API（后台「立即更新」按钮靠它）。
#
# 数据在 ./data（容器里的 /data），重建容器不会碰它。


services:
  buding-site:
    # GitHub Actions 构建好的 arm64 镜像（公开包，匿名可拉）
    image: ghcr.io/lengbuding1991/buding-site:latest
    container_name: buding-site
    restart: unless-stopped

    # 只有打了这个标签的容器才归 watchtower 管（NAS 上那个独立的 watchtower 项目会识别它）。
    # 工作台已经占用了宿主机的 3100，这里映射到 3110，容器内仍是 3100。
    # CF Tunnel 的 Service 填 http://localhost:3110。
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    ports:
      - "3110:3100"

    volumes:
      # 数据库（site.db + wal/shm），全在这一个目录里
      - ./data:/data
      # 固定时区
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: Asia/Shanghai
      # 后台密码（部署后请改掉默认值）
      ADMIN_PASSWORD: "buding2026"
      # 会话签名密钥（部署后请换成 openssl rand -hex 32 的输出）
      SESSION_SECRET: "change-me-to-openssl-rand-hex-32"
      # 站点对外地址（影响 OG 图 / RSS / sitemap 里的绝对链接）
      # 站点实际跑在 www 上，裸域 lbuding.com 由 Cloudflare 重定向规则 301 过来
      SITE_URL: "https://www.lbuding.com"
      # 保持 0：程序自己看 cloudflared 传来的 X-Forwarded-Proto 决定要不要给登录 cookie 加 Secure。
      # 走 CF 隧道是 https 会自动加；你在家里用 http://NAS的IP:3110 直连时是 http 不加。
      # 注意 0 是「自动判断」，不是「强制关」；只有写 1 才会强制 Secure。
      SITE_SECURE_COOKIE: "0"
      # 后台「检查并更新」按钮调的 watchtower HTTP API（走 wt-net 网络，服务名解析）。
      # TOKEN 必须和 watchtower 容器里的 WATCHTOWER_HTTP_API_TOKEN 完全一致，
      # 不一致会静默 401，按钮看着点了但日志里没有 "Updates triggered"。
      WATCHTOWER_URL: "http://watchtower:8080"
      WATCHTOWER_TOKEN: "GCoYJ99nBwOldp1TWmAm59ZZTlurLcm4"

    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # default = 本项目的网络；wtnet = 给 watchtower 通信用的中立网络。
    # 接进去后容器里可以用 http://watchtower:8080 调它的 HTTP API。
    networks:
      - default
      - wtnet

networks:
  wtnet:
    external: true
    name: wt-net

