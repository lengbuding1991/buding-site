# 把代码打成 arm64 镜像，推到 GHCR，供 NAS 直接拉取。
#
# 为什么需要这个：
#   NAS 上只有图形界面（UGOS Pro 的「项目」页面），它只会 `docker pull`，
#   没有 `docker compose build`。所以在 GitHub 上把镜像预先构建好，
#   让 NAS 那边只要「拉一个现成的镜像」就能跑。
#
# 为什么用 ubuntu-24.04-arm 而不是 QEMU：
#   QEMU 模拟 arm64 时 `next build` 会被 `qemu: uncaught target signal 4
#   (Illegal instruction)` 干掉（SWC 的原生二进制在模拟器里跑不了）。
#   换成 GitHub 原生的 arm64 runner 就没有这问题，而且快得多。
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成一个人可读的构建时间，写进镜像的 VERSION 文件。
      # 后台「系统更新」面板比较的就是它：点完更新后看到时间变了，就是真的更新了。
      # 用 sha 也能比，但一串 40 位十六进制肉眼没法确认。
      - name: 生成构建时间
        id: meta
        run: echo "build_date=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            SITE_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      # 清掉旧版本，只留最新 2 个。
      # 为什么要它：每个版本是一份完整快照，堆多了以后翻起来很乱。
      # latest 永远跟着最新那次构建，保留最新 2 个则 latest 必在内。
      - name: 清理旧镜像版本（只留最新 2 个）
        # 清理失败不该让整个构建显示红叉：镜像已经推上去了，
        # 只是没删成旧版本而已。真失败了去手动跑 cleanup-images。
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: buding-site
          package-type: container
          min-versions-to-keep: 2
          token: ${{ secrets.PACKAGES_PAT || secrets.GITHUB_TOKEN }}
